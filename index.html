<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d50f25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Material">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lista de Material</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one phone column on a knurled graphite case; red brand slab header, slanted red tool-label for each supplier/day, rugged plates per item */
:root{
  --bg:#141619; --surface:#1f2327; --surface2:#2a2f35; --ink:#f3f3f1; --muted:#a2aab3; --line:#3a4148;
  --red:#d50f25; --red-dark:#a80b1d; --red-ink:#ffffff; --hazard:#ffc400; --ok:#43b96f; --field:#0f1113; --warn:#ff5a6a;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cut:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(45deg,rgb(255 255 255 / .022) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(-45deg,rgb(0 0 0 / .25) 0 2px,transparent 2px 7px)}
img{max-width:100%}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* Header: red slab running edge to edge */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;gap:0;margin-inline:-16px;
  background:var(--bg);box-shadow:0 6px 14px rgb(0 0 0 / .45)}
header h1{background:var(--red);color:var(--red-ink);margin:0;padding:12px 16px 4px;
  font:italic 800 2rem/0.95 var(--display);text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.tape{display:inline-block;width:34px;height:18px;flex-shrink:0;transform:skewX(-14deg);
  background:repeating-linear-gradient(-45deg,var(--hazard) 0 6px,#111 6px 12px);border:2px solid #111}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--red);
  padding:2px 16px 10px;font:600 .82rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:rgb(255 255 255 / .85)}
.who b{color:#fff}
.linkbtn{border:0;background:transparent;color:#fff;text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.linkbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Tabs: dark rail, active tab is a slanted red plate */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#0c0d0f;padding:6px 10px;gap:4px;border-bottom:2px solid var(--red)}
.tabs button{font:italic 800 1rem var(--display);text-transform:uppercase;letter-spacing:.04em;border:0;padding:10px 2px;
  background:transparent;color:var(--muted);cursor:pointer;min-width:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tabs button[aria-selected="true"]{background:var(--red);color:#fff}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.tabs .n{font-variant-numeric:tabular-nums;font-style:normal;opacity:.85}

/* Panels and fields */
.card{background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:12px;margin-top:16px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
label.lbl{display:block;margin-bottom:4px;font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
input[type=text],select{width:100%;font:500 1rem var(--body);padding:12px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)}
input[type=text]::placeholder{color:#6d757e}
input[type=text]:focus,select:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font:700 .85rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.check input{width:22px;height:22px;accent-color:var(--red)}

/* Buttons */
.btn{font:italic 800 1.15rem var(--display);letter-spacing:.06em;text-transform:uppercase;border:0;padding:14px 18px;
  background:var(--red);color:var(--red-ink);cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  box-shadow:inset 0 -3px 0 var(--red-dark)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{filter:grayscale(.6);cursor:default}
.btn:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.ghost{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:2px;padding:7px 10px;cursor:pointer}
.ghost:hover{border-color:var(--muted)}
.ghost:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ghost.danger{color:var(--warn);border-color:var(--warn)}

/* Lists: supplier / day heading is a slanted red tool label */
main{display:grid;gap:22px;margin-top:20px}
.group{display:grid;gap:6px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--red)}
.ghead h2{margin:0;min-width:0;overflow-wrap:anywhere;background:var(--red);color:#fff;
  font:italic 800 1.15rem/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:7px 22px 6px 12px;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.ghead .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font:700 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums;flex-shrink:0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}

li.item,li.inv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px;background:var(--surface);
  border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
li.inv input[type=checkbox]{width:26px;height:26px;accent-color:var(--red)}
.tick{width:32px;height:32px;border-radius:3px;border:2px solid #6d757e;background:var(--field);cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.tick:hover{border-color:var(--red)}
.done .tick{background:var(--red);border-color:var(--red)}
.tick svg{width:18px;height:18px;opacity:0}.done .tick svg{opacity:1}
.tick:focus-visible,.x:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.txt{min-width:0}
.name{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.done .name{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)}
.nota{font-size:.88rem;font-style:italic;color:#d4d8dc;overflow-wrap:anywhere}
.qty{display:inline-block;margin-left:8px;font:italic 700 .95rem var(--display);background:#0c0d0f;color:var(--hazard);border:1px solid #4a4630;padding:0 7px;letter-spacing:.03em}
.sub{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.x{border:0;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:2px}
.x:hover{color:var(--warn)}
li.item.urgent{padding-left:24px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 6px,#111 6px 12px) left top/10px 100% no-repeat,var(--surface)}
.urgent .name::before{content:"URGENTE";font:italic 800 .78rem var(--display);letter-spacing:.08em;background:var(--hazard);color:#111;padding:2px 6px;margin-right:8px;vertical-align:2px}

.empty{text-align:center;color:var(--muted);padding:30px 16px;border:2px dashed var(--line);background:rgb(0 0 0 / .2)}
.empty b{display:block;color:var(--ink);font:italic 800 1.4rem var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.note{font-size:.9rem;color:var(--ink);padding:10px 12px;background:var(--surface2);border-left:4px solid var(--hazard);margin-top:14px}

/* Projects */
.ptitle{font:italic 800 1.9rem/1 var(--display);text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:anywhere}
li.proy{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);padding-right:6px}
li.proy .open{display:block;text-align:left;border:0;background:transparent;color:var(--ink);padding:14px;cursor:pointer;font:inherit;min-width:0}
li.proy .open:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
li.proy .open .name{font:italic 800 1.25rem var(--display);text-transform:uppercase;letter-spacing:.03em}
li.proy .open .name::after{content:" ›";color:var(--red)}
.pill{display:inline-block;font:italic 800 .78rem var(--display);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok);color:#0b1a10}
.pill.wait{background:var(--hazard);color:#111}
#proyDetail{margin-top:16px}
#proyProgress{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts .ghost{padding:4px 8px;font-size:.72rem}

/* Floating bars and menus */
.bar{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:grid}
.buybar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:8px;align-items:center;
  background:#0c0d0f;border:2px solid var(--red);padding:8px;box-shadow:0 10px 30px rgb(0 0 0 / .6);max-width:calc(100% - 32px)}
.buybar .ghost{padding:13px 14px}
#view-lista{padding-bottom:96px}
/* rows that hold a ⋮ menu can't be clipped or the menu gets cut off */
li.item.hist{grid-template-columns:1fr auto;clip-path:none}
.kebab-wrap{position:relative}
.kebab{width:38px;height:38px;border:1px solid transparent;border-radius:2px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.kebab svg{width:20px;height:20px}
.kebab[aria-expanded="true"],.kebab:hover{background:var(--surface2);border-color:var(--line);color:#fff}
.kebab:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:9;min-width:220px;background:#0c0d0f;border:1px solid var(--line);border-top:3px solid var(--red);box-shadow:0 12px 30px rgb(0 0 0 / .6);padding:4px;display:grid}
.menu button{font:700 .9rem var(--body);text-transform:uppercase;letter-spacing:.05em;text-align:left;border:0;background:transparent;color:var(--ink);padding:13px 12px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--surface2);outline:none}
.menu button.danger{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#111;
  padding:11px 18px;font:italic 800 1rem var(--display);text-transform:uppercase;letter-spacing:.04em;z-index:10;max-width:calc(100% - 32px);
  border-left:6px solid var(--red);box-shadow:0 10px 30px rgb(0 0 0 / .5)}
details summary{cursor:pointer;color:var(--muted);font-weight:700;padding:6px 2px}
@media (prefers-reduced-motion:no-preference){.tick,.btn{transition:background .15s,filter .15s}}

/* Login */
#login{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:56px 40px}
#login h1{margin:0;background:var(--red);color:#fff;padding:18px 18px 16px;font:italic 800 3rem/.88 var(--display);text-transform:uppercase;letter-spacing:.01em;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
#login h1 .tape{width:56px;height:16px}
#login > .sub{display:block;margin:12px 0 0 !important;font:700 .8rem var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
#login .err{color:var(--warn);font-weight:700;font-size:.9rem;margin:0}
</style>
</head>
<body>


<section id="login" hidden>
  <h1><span class="tape" aria-hidden="true"></span>Lista de material</h1>
  <p class="sub" style="margin:0 0 18px">Lista de compra compartida del equipo.</p>
  <form class="card" id="loginForm" autocomplete="off">
    <div><label class="lbl" for="l-name">Tu nombre</label><input type="text" id="l-name" maxlength="30" placeholder="Ej: Dani" required></div>
    <div><label class="lbl" for="l-code">Código del equipo</label><input type="text" id="l-code" autocapitalize="off" spellcheck="false" placeholder="Te lo pasa quien creó la lista" required></div>
    <p class="err" id="l-err" hidden></p>
    <button class="btn" type="submit" id="l-btn">Entrar</button>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <header>
    <h1><span class="tape" aria-hidden="true"></span>Lista de material</h1>
    <div class="who"><span>Hola, <b id="me"></b></span><button class="linkbtn" id="logout" type="button">No soy yo</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-lista" aria-selected="true">Por comprar <span class="n" id="n-lista"></span></button>
      <button role="tab" id="tab-proy" aria-selected="false">Proyectos</button>
      <button role="tab" id="tab-hist" aria-selected="false">Historial</button>
    </div>
  </header>

  <p class="note" id="status" hidden></p>

  <!-- LISTA -->
  <section id="view-lista">
    <form class="card" id="addForm" autocomplete="off">
      <div>
        <label class="lbl" for="f-name">¿Qué hace falta?</label>
        <input type="text" id="f-name" list="dl-names" placeholder="Ej: discos de corte 125 mm" required>
      </div>
      <div class="row2">
        <div><label class="lbl" for="f-qty">Cantidad</label><input type="text" id="f-qty" placeholder="Ej: 2 cajas"></div>
        <div><label class="lbl" for="f-sup">Proveedor</label><select id="f-sup"><option value="">Sin indicar</option><option>Ferretería FEKA</option><option>Saltoki</option><option>Otros</option></select></div>
      </div>
      <div><label class="lbl" for="f-note">Nota (opcional)</label><input type="text" id="f-note" maxlength="120" placeholder="Ej: ref. 4.5x40 inox, para el portal 3"></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px 18px">
        <label class="check"><input type="checkbox" id="f-urg"> Urgente</label>
      </div>
      <button class="btn" type="submit">Añadir a la lista</button>
    </form>
    <main id="lista"></main>
    <div class="buybar" id="buyBar" hidden>
      <button class="ghost" id="buyCancel">Cancelar</button>
      <button class="btn" id="buyOk">Confirmar compra</button>
    </div>
  </section>


  <!-- HISTORIAL -->
  <section id="view-hist" hidden>
    <main id="hist"></main>
  </section>

  <!-- PROYECTOS -->
  <section id="view-proy" hidden>
    <div id="proyList">
      <form class="card" id="proyForm" autocomplete="off">
        <div><label class="lbl" for="p-name">Nuevo proyecto</label><input type="text" id="p-name" placeholder="Ej: Reforma baño Calle Mayor 12" required></div>
        <button class="btn" type="submit">Crear proyecto</button>
      </form>
      <main id="proys"></main>
    </div>
    <div id="proyDetail" hidden>
      <div style="display:grid;gap:10px">
        <div><button class="ghost" id="proyBack">← Todos los proyectos</button></div>
        <h2 class="ptitle" id="proyTitle"></h2>
        <p class="sub" id="proyProgress" style="margin:0"></p>
      </div>
      <form class="card" id="matForm" autocomplete="off" style="margin-top:12px">
        <div><label class="lbl" for="m-name">Material que necesitamos</label><input type="text" id="m-name" list="dl-names" placeholder="Ej: tubo multicapa 16 mm" required></div>
        <div class="row2">
          <div><label class="lbl" for="m-qty">Cantidad</label><input type="text" id="m-qty" placeholder="Ej: 20 m"></div>
          <div><label class="lbl" for="m-sup">Proveedor</label><select id="m-sup"><option value="">Sin indicar</option><option>Ferretería FEKA</option><option>Saltoki</option><option>Otros</option></select></div>
        </div>
        <div><label class="lbl" for="m-note">Nota (opcional)</label><input type="text" id="m-note" maxlength="120" placeholder="Ej: que sea de la marca Uponor"></div>
        <button class="btn" type="submit">Añadir material</button>
      </form>
      <main id="mats"></main>
      <div class="bar" id="matBar" hidden><button class="btn" id="matAdd">Pasar a la lista de compra</button></div>
    </div>
  </section>
</div>

<datalist id="dl-names"></datalist>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const $ = s => document.querySelector(s);
const SIN = "Sin proveedor";
const SUPS = ["Ferretería FEKA", "Saltoki", "Otros"];
let db = null, myName = "", canWrite = true;
let items = [];
let confirmClear = false;

const norm = s => (s || "").trim().toLowerCase();
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
function status(msg){ const s = $("#status"); s.textContent = msg || ""; s.hidden = !msg; }
function ago(ts){
  if(!ts) return ""; const m = Math.round((Date.now() - ts) / 60000);
  if(m < 1) return "ahora"; if(m < 60) return "hace " + m + " min";
  const h = Math.round(m / 60); if(h < 24) return "hace " + h + " h";
  return new Date(ts).toLocaleDateString("es-ES", {day:"numeric", month:"short"});
}
function fail(e){
  if(e && e.code === "permission-denied"){ saveSession(null); showLogin(); $("#l-err").textContent = "El código del equipo ha cambiado. Vuelve a entrar con el nuevo."; $("#l-err").hidden = false; }
  else if(e && e.code === "resource-exhausted") toast("Se ha llegado al límite gratuito de hoy. Prueba mañana.");
  else toast("No se ha podido guardar. Inténtalo de nuevo.");
}
function applyWrite(){
  ["#addForm", "#proyForm", "#matForm"].forEach(s => $(s).hidden = !canWrite);
}

/* Tabs */
const TABS = ["lista", "proy", "hist"];
function setTab(t){
  for(const k of TABS){ $("#tab-" + k).setAttribute("aria-selected", k === t); $("#view-" + k).hidden = k !== t; }
  try{ localStorage.setItem("tab", t); }catch(_){}
}
for(const k of TABS) $("#tab-" + k).onclick = () => setTab(k);
try{ const t = localStorage.getItem("tab"); if(TABS.includes(t)) setTab(t); }catch(_){}

/* Autofill supplier from the last time that material was asked for */
$("#f-name").addEventListener("change", () => {
  const h = lastByName($("#f-name").value);
  if(h && !$("#f-sup").value && SUPS.includes(h.supplier)) $("#f-sup").value = h.supplier;
});

$("#addForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!db) return;
  const name = $("#f-name").value.trim(); if(!name) return;
  const supplier = $("#f-sup").value.trim(), qty = $("#f-qty").value.trim();
  try{
    await db.collection("items").add({name, qty, supplier, note: $("#f-note").value.trim(), urgent: $("#f-urg").checked, done:false, byName: myName, at: Date.now()});
    e.target.reset(); $("#f-name").focus(); toast("Añadido: " + name);
  }catch(err){ fail(err); }
});



async function toggleDone(it){
  try{
    await db.doc("items/" + it.id).update({done: !it.done, doneAt: !it.done ? Date.now() : null, doneByName: !it.done ? myName : null});
    toast(it.done ? "Devuelto a Por comprar: " + it.name : "Comprado. Pasa al historial");
  }catch(err){ fail(err); }
}
async function removeItem(it){ try{ await db.doc("items/" + it.id).delete(); }catch(err){ fail(err); } }


const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8.5l3 3 7-7"/></svg>';

/* Tick marks a pending item as selected; the bottom "Confirmar" button moves the selection to the historial */
const buySel = new Set();
function updateBuyBar(){
  $("#buyBar").hidden = buySel.size === 0;
  $("#buyOk").textContent = "Confirmar compra (" + buySel.size + ")";
}
$("#buyCancel").onclick = () => { buySel.clear(); renderLista(); };
$("#buyOk").onclick = async () => {
  const pick = items.filter(i => buySel.has(i.id) && !i.done);
  buySel.clear(); updateBuyBar();
  let n = 0;
  for(const it of pick){
    try{ await db.doc("items/" + it.id).update({done:true, doneAt: Date.now(), doneByName: myName}); n++; }
    catch(err){ fail(err); break; }
  }
  if(n) toast(n === 1 ? "1 compra pasada al historial" : n + " compras pasadas al historial");
};

function itemRow(it, names){
  const li = el("li", "item" + (buySel.has(it.id) ? " done" : "") + (it.urgent ? " urgent" : ""));
  const b = el("button", "tick"); b.innerHTML = CHECK;
  b.setAttribute("aria-label", "Marcar comprado: " + it.name);
  b.setAttribute("aria-pressed", buySel.has(it.id));
  b.disabled = !canWrite;
  b.onclick = () => {
    buySel.has(it.id) ? buySel.delete(it.id) : buySel.add(it.id);
    li.classList.toggle("done", buySel.has(it.id)); b.setAttribute("aria-pressed", buySel.has(it.id));
    updateBuyBar();
  };
  const t = el("div", "txt");
  const n = el("div", "name", it.name); if(it.qty) n.append(el("span", "qty", it.qty));
  const nota = it.note ? el("div", "nota", it.note) : "";
  const who = (it.done ? it.doneByName : it.byName) || "Alguien";
  t.append(n, nota, el("div", "sub", (it.project ? "Proyecto: " + it.project + " · " : "") + (it.done ? "Comprado por " : "Pedido por ") + who + " · " + ago(it.done ? it.doneAt : it.at)));
  const x = el("button", "x", "×"); x.setAttribute("aria-label", "Quitar " + it.name); x.hidden = !canWrite; x.onclick = () => removeItem(it);
  li.append(b, t, x); return li;
}

async function renderLista(){
  const root = $("#lista");
  const pend = items.filter(i => !i.done), done = items.filter(i => i.done);
  $("#n-lista").textContent = pend.length ? "(" + pend.length + ")" : "";
  const names = {};  // kept for row helpers; names now live on each item

  for(const id of [...buySel]) if(!pend.some(i => i.id === id)) buySel.delete(id);
  updateBuyBar();
  root.replaceChildren();
  if(!pend.length){
    const e = el("div", "empty"); e.append(el("b", null, "No falta nada"));
    e.append(document.createTextNode("Añade arriba lo que haga falta, o pasa material desde un proyecto."));
    root.append(e);
  }
  const groups = {};
  for(const i of pend){ const k = i.supplier || SIN; (groups[k] = groups[k] || []).push(i); }
  const keys = Object.keys(groups).sort((a, b) => a === SIN ? 1 : b === SIN ? -1 : a.localeCompare(b, "es"));
  for(const k of keys){
    const list = groups[k].sort((a, b) => (b.urgent - a.urgent) || (a.at - b.at));
    const g = el("section", "group"), h = el("div", "ghead");
    const meta = el("div", "meta"); meta.append(el("span", null, list.length + (list.length === 1 ? " artículo" : " artículos")));
    h.append(el("h2", null, k), meta);
    const ul = el("ul"); list.forEach(i => ul.append(itemRow(i, names)));
    g.append(h, ul); root.append(g);
  }
  renderHist(done, names);
  updateDatalists();
}

function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function dayLabel(ts){
  const today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
  if(dayKey(ts) === dayKey(today)) return "Hoy";
  if(dayKey(ts) === dayKey(y)) return "Ayer";
  const s = new Date(ts).toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long", year: new Date(ts).getFullYear() === today.getFullYear() ? undefined : "numeric"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const DOTS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
let histMenu = null, histDel = false;
document.addEventListener("click", () => {
  if(histMenu){ histMenu = null; histDel = false; renderLista(); }
  if(proyMenu){ proyMenu = null; proyDel = false; renderProy(); }
});
function renderHist(done, names){
  const root = $("#hist");
  root.replaceChildren();
  if(!done.length){
    const e = el("div", "empty"); e.append(el("b", null, "Todavía no hay compras"));
    e.append(document.createTextNode("Cuando marques algo como comprado en Por comprar, aparecerá aquí ordenado por día."));
    root.append(e); return;
  }
  const days = {};
  for(const i of done.slice().sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0))){
    const k = dayKey(i.doneAt || i.at || 0); (days[k] = days[k] || []).push(i);
  }
  for(const k of Object.keys(days)){
    const list = days[k];
    const g = el("section", "group"), h = el("div", "ghead");
    h.append(el("h2", null, dayLabel(list[0].doneAt || list[0].at || 0)), el("div", "meta", list.length + (list.length === 1 ? " compra" : " compras")));
    const ul = el("ul");
    for(const it of list){
      const li = el("li", "item hist");
      const t = el("div", "txt");
      const n = el("div", "name", it.name); if(it.qty) n.append(el("span", "qty", it.qty));
      const nota = it.note ? el("div", "nota", it.note) : "";
      const hora = it.doneAt ? new Date(it.doneAt).toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"}) : "";
      const parts = [it.supplier || SIN, it.project ? "Proyecto: " + it.project : "", "Comprado por " + (it.doneByName || "Alguien"), hora].filter(Boolean);
      t.append(n, nota, el("div", "sub", parts.join(" · ")));
      const wrap = el("div", "kebab-wrap");
      const b = el("button", "kebab"); b.innerHTML = DOTS;
      b.setAttribute("aria-label", "Opciones: " + it.name);
      b.setAttribute("aria-expanded", histMenu === it.id);
      b.hidden = !canWrite;
      b.onclick = e => { e.stopPropagation(); histMenu = histMenu === it.id ? null : it.id; histDel = false; renderLista(); };
      wrap.append(b);
      if(histMenu === it.id){
        const m = el("div", "menu"); m.setAttribute("role", "menu");
        m.onclick = e => e.stopPropagation();
        const back = el("button", null, "Devolver a Por comprar"); back.setAttribute("role", "menuitem");
        back.onclick = () => { histMenu = null; toggleDone(it); };
        const del = el("button", "danger", histDel ? "Sí, eliminar del todo" : "Eliminar"); del.setAttribute("role", "menuitem");
        del.onclick = async () => {
          if(!histDel){ histDel = true; renderLista(); return; }
          histMenu = null; histDel = false;
          try{ await db.doc("items/" + it.id).delete(); toast("Eliminado del historial"); }catch(err){ fail(err); }
        };
        m.append(back, del); wrap.append(m);
      }
      li.append(t, wrap); ul.append(li);
    }
    g.append(h, ul); root.append(g);
  }
}

function lastByName(name){
  return items.filter(i => norm(i.name) === norm(name)).sort((a, b) => (b.at || 0) - (a.at || 0))[0];
}
function updateDatalists(){
  const dn = $("#dl-names"); const seen = new Map(); for(const i of items) if(!seen.has(norm(i.name))) seen.set(norm(i.name), i.name);
  dn.replaceChildren(...[...seen.values()].sort((a, b) => a.localeCompare(b, "es")).map(s => { const o = el("option"); o.value = s; return o; }));
}

/* Proyectos: each project keeps its own material list in proyectos/<id>/materiales */
let proys = [], openProy = null, mats = [], matsUnsub = null, proyMenu = null, proyDel = false, proySeen = null;
const matSel = new Set(), matConfirm = new Set();
const connLost = () => status("Se ha perdido la conexión con la lista. Recarga la página.");
const matPath = () => "proyectos/" + openProy + "/materiales";

$("#proyForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!db) return;
  const name = $("#p-name").value.trim(); if(!name) return;
  try{ const ref = await db.collection("proyectos").add({name, at: Date.now(), byName: myName}); e.target.reset(); openProject(ref.id); }
  catch(err){ fail(err); }
});
$("#proyBack").onclick = () => closeProject();

function openProject(id){
  if(matsUnsub) matsUnsub();
  openProy = id; mats = []; matSel.clear(); matConfirm.clear();
  matsUnsub = db.collection(matPath()).onSnapshot(s => { mats = s.docs.map(d => ({id:d.id, ...d.data()})); renderProy(); }, connLost);
  renderProy(); window.scrollTo(0, 0);
}
function closeProject(){
  if(matsUnsub) matsUnsub();
  matsUnsub = null; openProy = null; mats = []; matSel.clear();
  renderProy();
}

$("#matForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!db || !openProy) return;
  const name = $("#m-name").value.trim(); if(!name) return;
  try{
    await db.collection(matPath()).add({name, qty: $("#m-qty").value.trim(), supplier: $("#m-sup").value, note: $("#m-note").value.trim(), at: Date.now()});
    e.target.reset(); $("#m-name").focus();
  }catch(err){ fail(err); }
});
$("#m-name").addEventListener("change", () => {
  const h = lastByName($("#m-name").value);
  if(h && !$("#m-sup").value && SUPS.includes(h.supplier)) $("#m-sup").value = h.supplier;
});

const matItem = m => m.itemId ? items.find(i => i.id === m.itemId) : null;

$("#matAdd").onclick = async () => {
  const p = proys.find(p => p.id === openProy); if(!p) return;
  const pick = mats.filter(m => matSel.has(m.id) && !matItem(m));
  matSel.clear(); renderProy();
  let n = 0;
  for(const m of pick){
    try{
      const ref = await db.collection("items").add({name: m.name, qty: m.qty || "", supplier: m.supplier || "", note: m.note || "", project: p.name, projectId: p.id, urgent:false, done:false, byName: myName, at: Date.now()});
      await db.doc(matPath() + "/" + m.id).update({itemId: ref.id});
      n++;
    }catch(err){ fail(err); break; }
  }
  if(n) toast(n === 1 ? "1 material pasado a Por comprar" : n + " materiales pasados a Por comprar");
};

async function removeMat(m){
  if(!matConfirm.has(m.id)){ matConfirm.add(m.id); renderProy(); setTimeout(() => { matConfirm.delete(m.id); renderProy(); }, 4000); return; }
  matConfirm.delete(m.id);
  try{ await db.doc(matPath() + "/" + m.id).delete(); }catch(err){ fail(err); }
}
async function removeProject(p){
  try{
    const s = await db.collection("proyectos/" + p.id + "/materiales").get();
    for(const d of s.docs) await db.doc("proyectos/" + p.id + "/materiales/" + d.id).delete();
    await db.doc("proyectos/" + p.id).delete();
    toast("Proyecto eliminado");
  }catch(err){ fail(err); }
}

function renderProy(){
  const p = openProy ? proys.find(p => p.id === openProy) : null;
  if(p) proySeen = openProy;
  if(openProy && !p && proySeen === openProy){ closeProject(); return; }   // deleted by someone else
  $("#proyList").hidden = !!openProy; $("#proyDetail").hidden = !openProy;
  if(!openProy){
    const root = $("#proys"); root.replaceChildren();
    if(!proys.length){
      const e = el("div", "empty"); e.append(el("b", null, "Sin proyectos"));
      e.append(document.createTextNode("Crea un proyecto para cada obra o trabajo y apunta dentro el material que vais a necesitar."));
      root.append(e); return;
    }
    const ul = el("ul");
    for(const p of proys.slice().sort((a, b) => (b.at || 0) - (a.at || 0))){
      const li = el("li", "proy");
      const o = el("button", "open"); o.onclick = () => openProject(p.id);
      o.append(el("div", "name", p.name), el("div", "sub", "Creado " + ago(p.at)));
      const wrap = el("div", "kebab-wrap");
      const b = el("button", "kebab"); b.innerHTML = DOTS; b.hidden = !canWrite;
      b.setAttribute("aria-label", "Opciones: " + p.name); b.setAttribute("aria-expanded", proyMenu === p.id);
      b.onclick = e => { e.stopPropagation(); proyMenu = proyMenu === p.id ? null : p.id; proyDel = false; renderProy(); };
      wrap.append(b);
      if(proyMenu === p.id){
        const m = el("div", "menu"); m.setAttribute("role", "menu"); m.onclick = e => e.stopPropagation();
        const del = el("button", "danger", proyDel ? "Sí, eliminar proyecto y su material" : "Eliminar proyecto"); del.setAttribute("role", "menuitem");
        del.onclick = () => { if(!proyDel){ proyDel = true; renderProy(); return; } proyMenu = null; proyDel = false; removeProject(p); };
        m.append(del); wrap.append(m);
      }
      li.append(o, wrap); ul.append(li);
    }
    $("#proys").append(ul);
    return;
  }
  $("#proyTitle").textContent = p ? p.name : "";
  const bought = mats.filter(m => { const i = matItem(m); return i && i.done; }).length;
  const listed = mats.filter(m => { const i = matItem(m); return i && !i.done; }).length;
  $("#proyProgress").textContent = mats.length
    ? mats.length + (mats.length === 1 ? " material" : " materiales") + " · " + bought + " comprado" + (bought === 1 ? "" : "s") + " · " + listed + " en la lista"
    : "";
  const root = $("#mats"); root.replaceChildren();
  if(!mats.length){
    const e = el("div", "empty"); e.append(el("b", null, "Aún no hay material"));
    e.append(document.createTextNode("Apunta arriba lo que vais a necesitar. Luego marca lo que haya que comprar y pásalo a la lista."));
    root.append(e);
  } else {
    const ul = el("ul");
    for(const m of mats.slice().sort((a, b) => (a.at || 0) - (b.at || 0))){
      const it = matItem(m);
      if(it) matSel.delete(m.id);
      const li = el("li", "inv");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "mat-" + m.id;
      cb.checked = !!(it && it.done) || matSel.has(m.id); cb.disabled = !!it || !canWrite;
      cb.setAttribute("aria-label", "Comprar " + m.name);
      cb.onchange = () => { cb.checked ? matSel.add(m.id) : matSel.delete(m.id); updateMatBar(); };
      const t = el("div", "txt");
      const lab = document.createElement("label"); lab.htmlFor = cb.id; lab.className = "name"; lab.textContent = m.name;
      if(m.qty) lab.append(el("span", "qty", m.qty));
      const mnota = m.note ? el("div", "nota", m.note) : "";
      t.append(lab, mnota);
      const sub = el("div", "sub");
      if(it) sub.append(el("span", "pill " + (it.done ? "ok" : "wait"), it.done ? "Comprado" : "En la lista"), " ");
      if(m.supplier) sub.append(m.supplier);
      if(sub.childNodes.length) t.append(sub);
      const right = el("div");
      if(canWrite){
        const x = el("button", "ghost danger", matConfirm.has(m.id) ? "¿Seguro?" : "Quitar"); x.onclick = () => removeMat(m);
        right.append(x);
      }
      li.append(cb, t, right); ul.append(li);
    }
    root.append(ul);
  }
  updateMatBar();
}
function updateMatBar(){
  $("#matBar").hidden = matSel.size === 0;
  $("#matAdd").textContent = "Pasar " + matSel.size + (matSel.size === 1 ? " material" : " materiales") + " a la lista de compra";
}

renderLista(); renderProy();

/* ---------- Firebase: every path lives under equipos/<código del equipo>/ ---------- */
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fs = getFirestore(fbApp);

function makeDb(base){
  return {
    collection(p){
      const ref = collection(fs, base + "/" + p);
      return {
        add: async data => { const r = await addDoc(ref, data); return {id: r.id}; },
        onSnapshot: (next, err) => onSnapshot(ref, next, err),
        get: () => getDocs(ref),
      };
    },
    doc(p){
      const ref = doc(fs, base + "/" + p);
      return { update: d => updateDoc(ref, d), delete: () => deleteDoc(ref) };
    },
  };
}

function loadSession(){ try{ return JSON.parse(localStorage.getItem("sesion") || "null"); }catch(_){ return null; } }
function saveSession(v){ try{ v ? localStorage.setItem("sesion", JSON.stringify(v)) : localStorage.removeItem("sesion"); }catch(_){} }
const validCode = c => /^[A-Za-z0-9_-]{4,60}$/.test(c);

let unsubs = [];
function showLogin(prefill){
  unsubs.forEach(u => u()); unsubs = [];
  $("#app").hidden = true; $("#login").hidden = false;
  if(prefill){ $("#l-code").value = prefill.code || ""; $("#l-name").value = ""; }
  $("#l-name").focus();
}

async function checkCode(code){
  await signInAnonymously(auth);
  await getDocs(query(collection(fs, "equipos/" + code + "/items"), limit(1)));   // rejects with permission-denied on a wrong code
}

function startApp(sess){
  myName = sess.name;
  db = makeDb("equipos/" + sess.code);
  $("#me").textContent = myName;
  $("#login").hidden = true; $("#app").hidden = false;
  applyWrite();
  unsubs.push(db.collection("items").onSnapshot(s => { items = s.docs.map(d => ({id:d.id, ...d.data()})); renderLista(); renderProy(); }, connLost));
  unsubs.push(db.collection("proyectos").onSnapshot(s => { proys = s.docs.map(d => ({id:d.id, ...d.data()})); renderProy(); }, connLost));
}

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#l-name").value.trim(), code = $("#l-code").value.trim();
  const err = $("#l-err"); err.hidden = true;
  if(!name) return;
  if(!validCode(code)){ err.textContent = "El código no es válido. Revisa que esté bien copiado."; err.hidden = false; return; }
  $("#l-btn").disabled = true; $("#l-btn").textContent = "Entrando…";
  try{
    await checkCode(code);
    const sess = {name, code}; saveSession(sess); startApp(sess);
  }catch(ex){
    err.textContent = ex && ex.code === "permission-denied" ? "Código incorrecto. Pídelo otra vez a quien creó la lista." : "No se ha podido conectar. Revisa la conexión a internet.";
    err.hidden = false;
  }finally{ $("#l-btn").disabled = false; $("#l-btn").textContent = "Entrar"; }
});
$("#logout").onclick = () => { const s = loadSession(); saveSession(null); closeProject(); showLogin(s); };

/* Local design preview only: http://localhost:8765/?demo shows sample rows without touching Firebase */
if(location.hostname === "localhost" && location.search.includes("demo")){
  const now = Date.now(), H = 3600000;
  // In-memory stand-in for makeDb() so every button works in the preview; nothing is saved
  const cols = {}, subs = {};
  const snap = p => ({docs: Object.entries(cols[p] || {}).map(([id, d]) => ({id, data: () => d}))});
  const emit = p => (subs[p] || []).forEach(f => f(snap(p)));
  db = {
    collection: p => ({
      add: async d => { const id = "m" + Math.random().toString(36).slice(2, 9); (cols[p] = cols[p] || {})[id] = {...d}; emit(p); return {id}; },
      onSnapshot: f => { (subs[p] = subs[p] || []).push(f); f(snap(p)); return () => { subs[p] = subs[p].filter(x => x !== f); }; },
      get: async () => snap(p),
    }),
    doc: path => {
      const i = path.lastIndexOf("/"), c = path.slice(0, i), id = path.slice(i + 1);
      return {
        update: async d => { cols[c][id] = {...cols[c][id], ...d}; emit(c); },
        delete: async () => { if(cols[c]) delete cols[c][id]; emit(c); },
      };
    },
  };
  const seed = (p, rows) => { cols[p] = {}; rows.forEach(({id, ...d}) => cols[p][id] = d); };

  myName = "Dani"; $("#me").textContent = myName;
  $("#login").hidden = true; $("#app").hidden = false;
  seed("items", [
    {id:"d1", name:"Discos de corte 125 mm", qty:"2 cajas", supplier:"Ferretería FEKA", note:"Los finos de inox", urgent:true, done:false, byName:"Pablo", at: now - 2*H},
    {id:"d2", name:"Silicona transparente", qty:"6 uds", supplier:"Ferretería FEKA", done:false, byName:"Dani", at: now - H},
    {id:"d3", name:"Tubo multicapa 16 mm", qty:"20 m", supplier:"Saltoki", project:"Reforma baño C/ Mayor 12", done:false, byName:"Marta", at: now - 30*60000},
    {id:"d4", name:"Codos 16 mm press", qty:"10", supplier:"Saltoki", done:false, byName:"Dani", at: now - 20*60000},
    {id:"d5", name:"Cinta americana", done:false, byName:"Luis", at: now - 5*60000},
    {id:"d6", name:"Brocas SDS 8 mm", qty:"3", supplier:"Ferretería FEKA", done:true, byName:"Pablo", doneByName:"Dani", at: now - 30*H, doneAt: now - 26*H},
    {id:"d7", name:"Tacos nylon 8", qty:"1 caja", supplier:"Otros", done:true, byName:"Luis", doneByName:"Marta", at: now - 5*H, doneAt: now - 2*H},
  ]);
  seed("proyectos", [{id:"p1", name:"Reforma baño C/ Mayor 12", at: now - 50*H}, {id:"p2", name:"Portal 3 iluminación", at: now - 120*H}]);
  seed("proyectos/p1/materiales", [
    {id:"m1", name:"Tubo multicapa 16 mm", qty:"20 m", supplier:"Saltoki", itemId:"d3", at: now - 40*H},
    {id:"m2", name:"Plato de ducha 80x120", qty:"1", supplier:"Saltoki", note:"Blanco, antideslizante", at: now - 39*H},
    {id:"m3", name:"Silicona sanitaria", qty:"2", supplier:"Ferretería FEKA", at: now - 38*H},
  ]);
  applyWrite();
  db.collection("items").onSnapshot(s => { items = s.docs.map(d => ({id:d.id, ...d.data()})); renderLista(); renderProy(); });
  db.collection("proyectos").onSnapshot(s => { proys = s.docs.map(d => ({id:d.id, ...d.data()})); renderProy(); });
} else (async () => {
  const sess = loadSession();
  if(!sess){ showLogin(); return; }
  try{ await signInAnonymously(auth); startApp(sess); }
  catch(_){ startApp(sess); status("Sin conexión. Los cambios se verán cuando vuelva internet."); }
})();
